[package]
name = "mclite"
version = "0.9.1"
edition = "2021"
description = "Launcher lite de Minecraft para Windows (nativo, sin runtime)"
authors = ["Juan Vivenes"]
license-file = "LICENSE"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "8", default-features = true }
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
dirs = "7"
regex-lite = "0.1"
thiserror = "2"

# GUI (opcional, para poder compilar y testear el core sin arrastrar egui/wgpu)
egui = { version = "0.32", optional = true }
eframe = { version = "0.32", optional = true, default-features = false, features = [
    "wgpu",
    "default_fonts",
    # Backends de escritorio de winit: en Windows son un no-op, en Linux
    # hacen falta para que winit compile (sin ellos, compile_error!).
    "x11",
    "wayland",
] }
# Backends de render de wgpu. Sin esto, pánico al arrancar:
# "No wgpu backend feature that is implemented for the target platform was
# enabled" — porque apagamos los defaults de eframe y su feature `wgpu` solo
# declara la dependencia, sin activar dx12/vulkan (vienen de su `default`).
wgpu = { version = "25", default-features = false, features = [
    "dx12",
    "vulkan",
    "gles",
    "wgsl",
] }
# Los iconos de Modrinth se cargan por URL: `http` los descarga (ehttp) y
# `image` los decodifica. La mayoría de iconos de Modrinth son WEBP (verificado
# en la API), así que hay que activar también `webp`; y `png`/`jpeg` vienen
# incluidos por defecto en el crate image de egui_extras.
egui_extras = { version = "0.32", default-features = false, features = ["image", "http", "webp"] }

[build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.release.package."*"]
opt-level = "s"
